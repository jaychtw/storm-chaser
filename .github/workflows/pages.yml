name: Bounded JMA Pages edition
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: storm-chaser-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pages-state
          key: pages-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-state-v1-
      - run: STORM_PAGES=1 npm run build
      - name: Reconcile official source and generate validated static JSON
        run: node --import tsx scripts/pages-collect.ts
      - name: Validate bounded state before caching even a partial bootstrap
        if: always()
        id: state
        run: node scripts/pages-state-check.mjs
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.state.outcome == 'success'
        with:
          path: .pages-state
          key: pages-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Public distribution notices
        run: node scripts/pages-notices.mjs
      - run: node --import tsx scripts/pages-artifact.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
