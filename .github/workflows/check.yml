name: Local software checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          npm run preview -- --port 5173 > /tmp/storm-chaser-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:live-browser
          npm run test:product-browser
          npm run test:explorer-browser
          npm run test:finalization-browser
          npm run verify:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-software-review
          path: |
            docs/screenshots/
            docs/browser-results.json
            docs/v1f*.json
            docs/v1/*.json
