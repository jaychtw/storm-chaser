name: Prototype checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          npm run preview -- --port 5173 > /tmp/storm-chaser-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:live-browser
          npm run test:product-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-review
          path: |
            docs/screenshots/
            docs/browser-results.json
            docs/m3p-browser-results.json
            docs/m3p-demo-browser-results.json
            docs/m3p-acceptance-results.json
